D("Física","🔭","<b>Cinemática:</b> velocidade = Δs/Δt; aceleração = Δv/Δt.<br><b>Leis de Newton:</b> inércia (1ª), F = m·a (2ª), ação e reação (3ª). Atrito se opõe ao movimento; g ≈ 10 m/s².<br><b>Energia:</b> se conserva; cinética = mv²/2; potência = trabalho/tempo.<br><b>Hidrostática:</b> densidade = m/V; pressão = F/A.<br><b>Ondulatória:</b> frequência em Hz; refração = desvio ao mudar de meio.<br><b>Eletricidade:</b> corrente (A), tensão (V), 1ª Lei de Ohm: V = R·i.<br><b>Mais:</b> força, massa e peso; trabalho, energia cinética e potencial; calor, temperatura e dilatação; empuxo (Arquimedes); som, luz, lentes e espelhos; resistência, tensão e magnetismo.V = R·i.",

D("História","🏛️","<b>Idade Média:</b> feudalismo (terra, suserania e vassalagem).<br><b>Modernidade:</b> Renascimento (humanismo), Reforma Protestante (Lutero), Iluminismo (razão e liberdade), Revolução Industrial (Inglaterra, séc. XVIII).<br><b>Brasil Colônia:</b> capitanias hereditárias, escravidão africana, engenhos de cana.<br><b>Império e República:</b> Abolição (1888), República (1889).<br><b>Século XX:</b> Era Vargas (1930–45), nazismo e II Guerra, ditadura civil-militar (1964–85), Constituição de 1988.<br><b>Mais:</b> burguesia e absolutismo; humanismo e imprensa de Gutenberg; Revolução Francesa e Napoleão; Independência (1822) e Império; quilombos, bandeirantes e café; fascismo, comunismo, imperialismo e Holocausto.Constituição de 1988.",

let P={},G=null,mc=0;
try{P=JSON.parse(localStorage.getItem("cc")||"{}")}catch(e){}

function modal(h){let m=$("#md");if(m)m.remove();if(!h)return;m=document.createElement("div");m.id="md";m.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(m)}

 A.innerHTML=`<div class="top"><span id="moon">🌙</span></div><h1>🦉 CruzaCoruja 🐧</h1><p class="sub">Palavras cruzadas para o ENEM e vestibular</p>`+

 [0,1,2,3,4,5].map(k=>`<button class="lvb ${k==5?"sup":""}" ${k>done(i)?"disabled":""} onclick="play(${i},${k})">${k==5?"⭐ Super nível<br><small>só de "+w.n+"</small>":"Fase "+(k+1)+(k<done(i)?" ✅":"")}</button>`).join("")+

function build(i,k){const o=W[i].w;
 if(k==5)return{ws:o.slice(15).sort(()=>Math.random()-.5).slice(0,8),ids:[i]};
 const ws=[0,1,2].map(j=>o[k*3+j]),ids=[i];
 for(let j=1;j<=3;j++){const t=(i+j)%W.length;ws.push(W[t].w[15+(k*3+j)%15]);ids.push(t)}
 return{ws,ids}}

function lay(ws){let best,bs0=-1e9;
 for(let t=0;t<200;t++){
  const L=ws.map(([a,c])=>({a,c})).sort(()=>Math.random()-.5);
  if(t%2)L.sort((x,y)=>y.a.length-x.a.length);
  const g={},P=[];
  const put=(w,x,y,d)=>{w.z=1;for(let j=0;j<w.a.length;j++){const q=(x+(d?0:j))+","+(y+(d?j:0));g[q]=g[q]||{c:w.a[j],m:0};g[q].m|=1<<d}P.push({...w,x,y,d})};
  const ok=(a,x,y,d)=>{let h=0;const dx=d?0:1,dy=d?1:0;
   if(g[(x-dx)+","+(y-dy)]||g[(x+dx*a.length)+","+(y+dy*a.length)])return 0;
   for(let j=0;j<a.length;j++){const X=x+dx*j,Y=y+dy*j,q=g[X+","+Y];
    if(q){if(q.c!=a[j]||(q.m>>d&1))return 0;h++}
    else if(g[(X+dy)+","+(Y+dx)]||g[(X-dy)+","+(Y-dx)])return 0}
   return h};
  put(L[0],0,0,0);
  const bx=(x,y,d,n,B)=>[Math.min(B[0],x),Math.min(B[1],y),Math.max(B[2],x+(d?1:n)),Math.max(B[3],y+(d?n:1))];
  L[0].z=1;let B=[0,0,L[0].a.length,1];
  for(let pass=0;pass<3;pass++)for(const w of L){if(w.z)continue;let bs=1e9,bp;
   for(const p of P){const d=1-p.d;
    for(let i=0;i<p.a.length;i++)for(let j=0;j<w.a.length;j++){
     if(p.a[i]!=w.a[j])continue;
     const x=p.x+(p.d?0:i)-(d?0:j),y=p.y+(p.d?i:0)-(d?j:0);
     if(!ok(w.a,x,y,d))continue;
     const b=bx(x,y,d,w.a.length,B),s=Math.max(b[2]-b[0],b[3]-b[1])*100+(b[2]-b[0])*(b[3]-b[1]);
     if(s<bs){bs=s;bp=[x,y,d,b]}}}
   if(bp){put(w,bp[0],bp[1],bp[2]);B=bp[3]}}
  const sc=P.length*1e4-Math.max(B[2]-B[0],B[3]-B[1])*100-(B[2]-B[0])*(B[3]-B[1]);
  if(sc>bs0){bs0=sc;best=P}}
 const mx=Math.min(...best.map(w=>w.x)),my=Math.min(...best.map(w=>w.y));
 best.forEach(w=>{w.x-=mx;w.y-=my});
 const c=Math.max(...best.map(w=>w.x+(w.d?1:w.a.length))),r=Math.max(...best.map(w=>w.y+(w.d?w.a.length:1)));
 best.sort((a,b)=>a.y-b.y||a.x-b.x);
 const n={};let N=0;best.forEach(w=>{const q=w.x+","+w.y;w.n=n[q]||(n[q]=++N)});
 const S=Math.max(c,r),ox=(S-c)>>1,oy=(S-r)>>1;best.forEach(w=>{w.x+=ox;w.y+=oy});return{p:best,c:S,r:S}}

const cl=w=>[...w.a].map((_,j)=>(w.x+(w.d?0:j))+","+(w.y+(w.d?j:0)));
const solved=w=>cl(w).every((q,j)=>G.u[q]==w.a[j]);

function play(i,k){const L=build(i,k),l=lay(L.ws);
 G={i,k,ids:L.ids,p:l.p,c:l.c,r:l.r,u:{},sel:0,cur:cl(l.p[0])[0],w:0};
 document.body.classList.add("kbo");const rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM⌫"];
 A.innerHTML=`<div class="bar"><button onclick="world(${i})">←</button><span>${k==5?"⭐ Super nível":"Fase "+(k+1)}</span><span><button onclick="document.body.classList.toggle('kbo')">⌨️</button> <button onclick="hint()">💡</button> <button onclick="study(G.ids)">📖</button></span></div><div id="pl"></div><div class="kb">${rows.map(r=>`<div>${[...r].map(c=>`<button onclick="key('${c}')">${c}</button>`).join("")}</div>`).join("")}</div>`;
 draw()}

function draw(){const{p,c,r,u}=G,s=Math.max(22,Math.min(38,Math.floor((Math.min(innerWidth,560)-56)/c)-3));
 const hl=new Set(cl(p[G.sel])),num={},own={},okc=new Set();
 p.forEach(w=>{num[w.x+","+w.y]=w.n;cl(w).forEach(q=>own[q]=1);if(solved(w))cl(w).forEach(q=>okc.add(q))});
 let h="";
 for(let y=0;y<r;y++)for(let x=0;x<c;x++){const q=x+","+y;
  h+=own[q]?`<div class="cell ${hl.has(q)?"hl":""} ${q==G.cur?"cur":""} ${okc.has(q)?"ok":""}" onclick="tap('${q}')">${num[q]?`<i>${num[q]}</i>`:""}${u[q]||""}</div>`:`<div class="e"></div>`}
 $("#pl").innerHTML=`<div style="overflow-x:auto"><div class="g" style="--c:${c};--s:${s}px">${h}</div></div><ul>`+
 p.map((w,j)=>`<li class="${j==G.sel?"on":""} ${solved(w)?"dn":""}" onclick="selw(${j})"><b>${w.n}${w.d?"↓":"→"}</b> ${w.c} <small>(${w.a.length})</small></li>`).join("")+"</ul>";
 if(!G.w&&p.every(solved))setTimeout(win,250)}

function tap(q){const cand=G.p.map((_,j)=>j).filter(j=>cl(G.p[j]).includes(q));
 if(G.cur==q&&cand.length>1&&cand.includes(G.sel))G.sel=cand.find(j=>j!=G.sel);
 else if(!cand.includes(G.sel))G.sel=cand[0];
 G.cur=q;draw()}
function selw(j){G.sel=j;const q=cl(G.p[j]);G.cur=q.find(x=>!G.u[x])||q[0];draw()}
const lk=q=>G.p.some(w=>solved(w)&&cl(w).includes(q));
function key(ch){if(!G||!G.cur)return;const q=cl(G.p[G.sel]);let j=q.indexOf(G.cur);if(j<0)return;
 if(ch=="⌫"){if(lk(G.cur)||!G.u[G.cur]){do j--;while(j>=0&&lk(q[j]));if(j<0)return;G.cur=q[j]}delete G.u[G.cur]}
 else{if(lk(G.cur))return;G.u[G.cur]=ch;let n=j+1;while(n<q.length&&lk(q[n]))n++;if(n<q.length)G.cur=q[n]}
 draw()}
function hint(){const w=G.p[G.sel],q=cl(w);let j=Math.max(0,q.indexOf(G.cur));if(G.u[q[j]]==w.a[j]){const f=q.findIndex((x,t)=>G.u[x]!=w.a[t]);if(f<0)return;j=f}G.u[q[j]]=w.a[j];draw()}
function unlock(i,n){P[i]=Math.max(done(i),n||done(i)+1);save();n?home():world(i)}
function win(){if(!G||G.w)return;G.w=1;const{i,k}=G;if(done(i)<=k){P[i]=k+1;save()}
 modal(`<h2>🎉 ${k==5?"Mundo concluído!":"Fase concluída!"}</h2><p>${k==5?"A coruja está orgulhosa de você! 🦉":"Muito bem! Próxima fase liberada. 🐧"}</p><button onclick="modal();world(${i})">Continuar</button>`)}

document.addEventListener("keydown",e=>{if(!G||!$("#pl")||$("#md"))return;const k=e.key.toUpperCase();
 if(k=="BACKSPACE")key("⌫");else if(/^[A-Z]$/.test(k))key(k)});
home();
</script>
</body>
</html>
